name: Bug Report
description: Report a bug with the Enphase Battery integration
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!
        Please fill out the sections below to help us investigate.

  - type: input
    id: version
    attributes:
      label: Integration version
      description: Which version of the integration are you using?
      placeholder: "e.g. 2.34.0"
    validations:
      required: true

  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      description: Which version of Home Assistant are you running?
      placeholder: "e.g. 2024.12.0"
    validations:
      required: true

  - type: dropdown
    id: connection_mode
    attributes:
      label: Connection mode
      description: How is the integration connected?
      options:
        - Local
        - Cloud
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: |
        Please paste any relevant logs from Home Assistant.
        Enable debug logging first: Settings > Devices & Services > Enphase Battery > Enable debug logging
      render: text

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Any other context, screenshots, or information.
